<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vücut Kitle Endeksi Hesaplama</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h4 class="text-center mb-4 text-success">VKİ Hesaplayıcı</h4>
        <form id="vkiFormu">
            <div class="mb-3">
                <label for="kilo" class="form-label">Kilonuz (kg)</label>
                <input type="number" class="form-control" id="kilo" required min="1" step="0.1" placeholder="Örn: 75">
            </div>
            <div class="mb-3">
                <label for="boy" class="form-label">Boyunuz (cm)</label>
                <input type="number" class="form-control" id="boy" required min="1" placeholder="Örn: 175">
            </div>
            <button type="submit" class="btn btn-success w-100">Endeksi Hesapla</button>
        </form>
    </div>

    <script>
        // REFACTORING: VKİ hesaplayan ana fonksiyonumuz
        // Sadece matematiksel hesaplamayı yapar ve değeri döndürür.
        function vkiHesapla(kilo, boyCm) {
            let boyMetre = boyCm / 100; // cm'yi metreye çevir
            return kilo / (boyMetre * boyMetre); // Kilo / Boy'un karesi
        }

        // VKİ sonucuna göre durumu metin olarak döndüren yardımcı fonksiyon
        function durumDegerlendir(vki) {
            if (vki < 18.5) return { mesaj: "Zayıf", ikon: "warning" };
            if (vki >= 18.5 && vki <= 24.9) return { mesaj: "Normal Kilolu", ikon: "success" };
            if (vki >= 25 && vki <= 29.9) return { mesaj: "Fazla Kilolu", ikon: "info" };
            return { mesaj: "Obez", ikon: "error" };
        }

        // Form gönderildiğinde (post edildiğinde) çalışacak senaryo
        document.getElementById('vkiFormu').addEventListener('submit', function (event) {
            event.preventDefault();

            // 1. Girdileri al
            let kilo = parseFloat(document.getElementById('kilo').value);
            let boy = parseFloat(document.getElementById('boy').value);

            // 2. Fonksiyonları kullanarak hesaplamaları yap
            let vkiSonuc = vkiHesapla(kilo, boy);
            let analiz = durumDegerlendir(vkiSonuc);

            // 3. SweetAlert ile sonucu şık bir şekilde bas
            Swal.fire({
                title: `Durum: ${analiz.mesaj}`,
                html: `Vücut Kitle Endeksiniz: <b>${vkiSonuc.toFixed(2)}</b>`,
                icon: analiz.ikon,
                confirmButtonText: 'Anladım'
            });
        });
    </script>
</body>

</html>
